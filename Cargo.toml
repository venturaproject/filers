[package]
name = "rust-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum       = { version = "0.7", features = ["multipart", "macros"] }
tokio      = { version = "1",   features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

uuid    = { version = "1", features = ["v4", "serde"] }
chrono  = { version = "0.4", features = ["serde"] }

anyhow    = "1"
thiserror = "2"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dotenvy    = "0.15"
async-trait = "0.1"

dashmap  = "6"
rayon    = "1"

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }

calamine        = { version = "0.26", features = ["dates"] }
csv             = "1"
zip             = { version = "2.4", default-features = false, features = ["deflate"] }
quick-xml       = "0.31"
regex           = "1"
rust_xlsxwriter = "0.89"
reqwest         = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac            = "0.12"

bytes    = "1"
tempfile = "3"

utoipa        = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.1", features = ["axum"] }

argon2 = "0.5"
rand   = "0.8"
sha2   = "0.10"
base64 = "0.22"
libc   = "0.2"

[dev-dependencies]
tower           = { version = "0.5", features = ["util"] }
http-body-util  = "0.1"
tokio           = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json      = "1"
tempfile        = "3"

# Optimise dependencies even in dev builds — calamine / zip / xml parsing is
# ~8x slower unoptimised. Our own crate stays at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true

[lints.clippy]
dbg_macro   = "warn"
todo        = "warn"
unwrap_used = "warn"
