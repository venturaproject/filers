[advisories]
# RUSTSEC-2023-0071 — rsa 0.9 Marvin timing sidechannel (medium).
# Not compiled: rsa is present only via SQLx's optional MySQL driver; this
# service enables PostgreSQL only (`cargo tree -i rsa` is empty). Re-evaluate
# if a MySQL backend is added.
#
# RUSTSEC-2026-0459 — libsqlite3-sys SQLite CVE (medium).
# Not compiled: libsqlite3-sys is present only via SQLx's optional SQLite
# driver; this service enables PostgreSQL only (`cargo tree -i libsqlite3-sys`
# is empty). Re-evaluate if SQLite support is added.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0459",
]
